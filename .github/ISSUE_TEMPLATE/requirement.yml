name: Product requirement
description: Track one pitch requirement with acceptance criteria.
title: '[Requirement] '
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      placeholder: TTK-01
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User need
      description: Who needs this and what should they be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results that must pass before closing the issue.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: PR, passing CI run, live URL, screenshots or test result.
