# Weekly, capped dependency-update PRs. Never auto-merged: each PR needs the
# owning teammate's review and the normal three CI checks (docs/sprints-2-to-5.md).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    labels: [dependencies, "area:backend"]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    labels: [dependencies, "area:frontend"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 2
    labels: [dependencies, "area:devops"]
    groups:
      github-actions:
        patterns: ["*"]
