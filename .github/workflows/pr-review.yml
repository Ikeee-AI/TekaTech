name: PR automated review

# Free automated review on every PR, including PRs from forks (read-only
# token, no secrets). Findings appear as inline annotations on the changed
# files. It helps the human reviewer; it never replaces the teammate review.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BODY: ${{ github.event.pull_request.body }}
      TITLE: ${{ github.event.pull_request.title }}
      ADDITIONS: ${{ github.event.pull_request.additions }}
      DELETIONS: ${{ github.event.pull_request.deletions }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check issue link, size and sensitive paths
        run: |
          failed=0
          # 1. Every PR must point at its issue / task so the board and plan stay traceable.
          if ! grep -Eq '#[0-9]+|S[2-5]-(AD|MI|MA|JO|IK)|TTK-[0-9]{2}' <<< "$TITLE $BODY"; then
            echo "::error title=No linked issue::Reference the issue (Refs #23) or task ID (S2-JO / TTK-01) in the PR title or description."
            failed=1
          fi
          # 2. Small PRs are easier to review (course: small reviewed PRs). Warn only.
          changed=$((ADDITIONS + DELETIONS))
          if (( changed > 600 )); then
            echo "::warning title=Large PR::$changed changed lines. Consider splitting by task or owner; reviewers should allow extra time."
          fi
          # Three dots: only what this PR changed since it branched. Two dots also
          # listed files that main changed later (#215 was flagged for #210's SQL).
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          # 3. Pipeline, hosting and secret-handling changes need the DevOps owner's review.
          if [[ "$AUTHOR" != "Ikeee-AI" ]] && grep -Eq '^(\.github/|render\.yaml|scripts/check_secrets\.py|scripts/deployed_smoke\.py)' <<< "$files"; then
            echo "::warning title=Pipeline change::This PR changes CI/CD, hosting or secret checks. Request a review from Ikeee-AI (DevOps) before merging."
          fi
          # 4. Schema changes are applied by hand in Supabase; the PR must say how.
          if grep -q '^backend/sql/' <<< "$files" && ! grep -qiE 'supabase|sql editor|migration' <<< "$BODY"; then
            echo "::error title=SQL without instructions::backend/sql changed. Add manual application instructions (order, Supabase SQL Editor, compatibility) to the PR description."
            failed=1
          fi
          # 5. Environment files must never be committed (example files are fine).
          if grep -Eq '(^|/)\.env($|\.)' <<< "$files" && grep -Ev '\.env\.example$' <<< "$files" | grep -Eq '(^|/)\.env($|\.)'; then
            echo "::error title=Environment file::A .env file is part of this PR. Remove it and rotate any exposed keys."
            failed=1
          fi
          {
            echo "### PR policy"
            echo "- Changed lines: $changed"
            echo "- Files: $(wc -l <<< "$files")"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      # Ruff runs in the same job (was a separate "Python review" job): one runner start instead
      # of two per PR event saves about a minute each time (incident 2026-10-31, Actions minutes).
      # A description-only edit doesn't change code, so it re-runs the policy check only.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        with:
          version: '0.12.3'
      - name: Python review (ruff, non-blocking)
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        working-directory: backend
        # B008 is FastAPI's Depends() default-argument pattern; S101 allows asserts in tests.
        run: |
          uvx ruff==0.16.10 check . --select E4,E7,E9,F,B,S --ignore S101,B008 --exclude .venv \
            --output-format=github --exit-zero
          {
            echo "### Python review (ruff 0.16.10)"
            echo '```'
            uvx ruff==0.16.10 check . --select E4,E7,E9,F,B,S --ignore S101,B008 --exclude .venv --statistics --exit-zero
            echo '```'
            echo "Non-blocking: findings are review hints for the author and reviewer."
          } >> "$GITHUB_STEP_SUMMARY"
