name: Release notes

# Pushing a version tag (for example v1.0.0) on a main commit creates a GitHub
# Release with notes generated from the merged pull requests. It does not
# deploy: main is already deployed by the CI pipeline.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tag to point at main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; release only reviewed, merged commits."; exit 1
          fi
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "TekaTech $GITHUB_REF_NAME" \
            --notes "Commit: \`$GITHUB_SHA\`. Before announcing: confirm production serves this commit (verify-deploy / ops-health) and add known limitations and migration notes."
