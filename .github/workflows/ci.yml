name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: sk-test-dummy
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-dummy-key
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for the gitleaks scan
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Scan tracked files for secrets
        run: python ../scripts/check_secrets.py
      - name: Scan full Git history for secrets (gitleaks, redacted)
        working-directory: .
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts="--all" --exit-code 1 .
      - name: Lint GitHub Actions workflows (actionlint + shellcheck)
        working-directory: .
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - run: uv sync --frozen --python 3.12
      - name: Compile backend sources
        run: uv run --frozen python -m compileall -q ./*.py routers scripts  # every top-level module, not a hand-kept list
      - run: uv run --frozen pytest -q
      - name: Verify FastAPI application imports
        run: uv run --frozen python -c "from main import app; assert app.title == 'TekaTech API'"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-publishable-key
      VITE_API_BASE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests (Vitest, no network)
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: frontend-ci-build
          path: frontend/dist
          retention-days: 7

  browser:
    # #119: ask + compare journeys against each failure-drill mode, on a faked API
    # (frontend/e2e/README.md). Builds with fake *.e2e.test addresses, so it never
    # reaches Supabase, OpenAI, dev or production and needs no secrets.
    name: Browser checks (failure drill)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: browser-checks-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tekatech_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tekatech_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tekatech_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Check PostgreSQL client
        # The Ubuntu runner image already ships psql/createdb; apt-get here cost 9–20 s per run (#31).
        # Install only if a future image drops them.
        run: |
          if ! command -v psql >/dev/null || ! command -v createdb >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Create Supabase-compatible test roles
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/sql/ci_roles.sql
      - name: Assemble and apply tracked migrations twice
        run: |
          python backend/scripts/assemble_sql.py > /tmp/tekatech-setup.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/tekatech-setup.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/tekatech-setup.sql
      - name: Reconcile the legacy named-argument RPC overload
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/tests/sql/legacy_match_rpc.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/tekatech-setup.sql
      - name: Check database behavior and access grants
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/sql/schema_acceptance.sql
      - name: Verify a legacy project with vector in public
        run: |
          createdb tekatech_legacy_ci
          export PGDATABASE=tekatech_legacy_ci
          psql -v ON_ERROR_STOP=1 -c 'create extension vector with schema public'
          psql -v ON_ERROR_STOP=1 -f /tmp/tekatech-setup.sql
          psql -v ON_ERROR_STOP=1 -f backend/tests/sql/legacy_match_rpc.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/tekatech-setup.sql
          psql -v ON_ERROR_STOP=1 -f backend/tests/sql/schema_acceptance.sql

  main-guard:
    # Free-plan substitute for branch protection (HTTP 403 on this private repo):
    # it cannot stop a push, but unreviewed code never deploys and an issue is opened.
    name: Main guard (reviewed PR required)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      PUSHER: ${{ github.actor }}
    steps:
      - name: Require a merged PR approved by another teammate on its final commit
        id: guard
        run: |
          # GitHub links a merge commit to its PR a few seconds after the merge;
          # retry before concluding the commit was pushed without a PR (false alarm on 28132c9).
          pr=""
          for attempt in 1 2 3 4 5 6; do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty')
            [[ -n "$pr" ]] && break
            echo "No merged PR linked to $SHA yet (attempt $attempt/6); retrying in 10 s."
            sleep 10
          done
          if [[ -z "$pr" ]]; then
            echo "reason=Commit $SHA reached main without a merged pull request (pushed by @$PUSHER)." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          author=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.user.login')
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')
          approvals=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" --paginate \
            --jq ".[] | select(.state == \"APPROVED\" and .user.login != \"$author\" and .commit_id == \"$head\") | .id" | wc -l)
          if [[ "$approvals" -lt 1 ]]; then
            echo "reason=PR #$pr by @$author was merged without another teammate's approval on its final commit." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "PR #$pr by @$author: $approvals teammate approval(s) on final commit \`$head\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Open a process issue and stop the deploy
        if: failure()
        env:
          REASON: ${{ steps.guard.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "### Deploy blocked: $REASON" >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "$GITHUB_REPOSITORY" --label process --assignee Ikeee-AI \
            --title "Main guard: unreviewed change on main (${SHA:0:7})" \
            --body "${REASON:-Main guard failed.} Production was **not** deployed. Run: $RUN_URL

          Next: open a PR that reverts or re-submits the change for teammate review, or get the change reviewed and merged normally. Record the exception in the sprint log."

  deploy:
    name: Deploy main after checks
    needs: [backend, frontend, database, main-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Repository-level production hooks support this private repository on GitHub Free.
    # Environment secrets on private repositories require an eligible paid GitHub plan.
    # Backend: Railway (since 12 Nov 2026, docs/devops/railway-migration-plan.md;
    # service settings in .railway/railway.ts). Frontend: Render.
    # Secrets are scoped to the steps that use them, never job-wide, so the checkout,
    # setup and CLI-install steps cannot read them.
    env:
      API_URL: ${{ vars.PRODUCTION_API_URL }}
      FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Check deployment configuration
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" || -z "$FRONTEND_HOOK" || -z "$API_URL" || -z "$FRONTEND_URL" ]]; then
            echo "Deployment is not configured: needs secrets RAILWAY_TOKEN and RENDER_FRONTEND_DEPLOY_HOOK, and variables PRODUCTION_API_URL and PRODUCTION_FRONTEND_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Trigger Render frontend deployment
        env:
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$FRONTEND_HOOK&ref=${{ github.sha }}" > /dev/null
      - name: Install Railway CLI (pinned release binary, SHA256-checked)
        # The release tarball instead of `npm install -g @railway/cli`: the npm package's
        # postinstall script downloads this same binary, so no install script runs here.
        # Same version/checksum as rollback.yml; update both together.
        env:
          RAILWAY_CLI_VERSION: '5.71.0'
          RAILWAY_CLI_SHA256: 2e682fd2ddf8d6fdf9e46d9d99d99646ff0022a6abb0c2bca93011348a269fb9
        run: |
          curl -fsSLo /tmp/railway.tar.gz "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RAILWAY_CLI_SHA256}  /tmp/railway.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/railway-cli"
          tar -xzf /tmp/railway.tar.gz -C "$RUNNER_TEMP/railway-cli" railway
          "$RUNNER_TEMP/railway-cli/railway" --version
          echo "$RUNNER_TEMP/railway-cli" >> "$GITHUB_PATH"
      - name: Deploy backend to Railway
        timeout-minutes: 15
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set "APP_COMMIT=${{ github.sha }}" --service tekatech-api --environment production --skip-deploys
          railway up backend --path-as-root --service tekatech-api --environment production --ci
      - name: Verify live commit, database path and CORS
        timeout-minutes: 12
        run: |
          python scripts/deployed_smoke.py --api-url "$API_URL" --frontend-url "$FRONTEND_URL" --commit "${{ github.sha }}" --attempts 30 --delay 10 --report /tmp/deployed-smoke.json
          echo "Deployed ${{ github.sha }}: API on Railway ($API_URL), frontend on Render ($FRONTEND_URL)." >> "$GITHUB_STEP_SUMMARY"
      - name: Save deployment verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: deployed-smoke-${{ github.sha }}
          path: /tmp/deployed-smoke.json
          if-no-files-found: ignore
          retention-days: 30
