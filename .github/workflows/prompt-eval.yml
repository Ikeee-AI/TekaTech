name: Prompt evaluation

# Offline evaluation for PRs that change the prompt, the evaluation set or the scorer.
# Runs Adrian's scripts/eval_runner.py on every answers file under prompts/eval/ (the
# hand-written reference answers, plus any recorded model outputs committed there) and
# uploads labeled JSON + Markdown reports. No model calls and no secrets, so it is safe
# on fork PRs and costs nothing. Separate from CI: it is not a deploy dependency.
# Live scoring of real /query output needs the evaluation adapter (S3-MA, #84) and the
# budget-capped key; it is planned as a manual job (#32).

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'backend/prompts.py'
      - 'backend/citations.py'
      - 'scripts/eval_runner.py'
      - '.github/workflows/prompt-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-eval-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  evaluate:
    name: Offline prompt evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Score every answers file
        run: |
          # Label reports with the prompt in this commit without importing the backend.
          prompt_version=$(sed -nE 's/^PROMPT_VERSION = "([^"]+)".*/\1/p' backend/prompts.py)
          prompt_version=${prompt_version:-unknown}
          mkdir -p /tmp/eval
          status=0
          shopt -s nullglob
          for answers in prompts/eval/reference_answers.json prompts/eval/answers/*.json; do
            name=$(basename "$answers" .json)
            echo "::group::$name (prompt $prompt_version)"
            python scripts/eval_runner.py --answers "$answers" --prompt-version "$prompt_version" \
              --report "/tmp/eval/$name.json" --markdown "/tmp/eval/$name.md" || status=1
            echo "::endgroup::"
            {
              echo "### $name"
              cat "/tmp/eval/$name.md"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: Score the general-knowledge answers (#172)
        # Separate folder: answers/*.json above are scored as grounded answers.
        run: |
          gk_version=$(sed -nE 's/^GK_PROMPT_VERSION = "([^"]+)".*/\1/p' backend/prompts.py)
          gk_version=${gk_version:-unknown}
          mkdir -p /tmp/eval
          status=0
          shopt -s nullglob
          for answers in prompts/eval/gk_reference_answers.json prompts/eval/answers-gk/*.json; do
            name=gk-$(basename "$answers" .json)
            echo "::group::$name (prompt $gk_version)"
            python scripts/eval_runner.py --mode gk --answers "$answers" --prompt-version "$gk_version" \
              --report "/tmp/eval/$name.json" --markdown "/tmp/eval/$name.md" || status=1
            echo "::endgroup::"
            {
              echo "### $name"
              cat "/tmp/eval/$name.md"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prompt-eval-reports
          path: /tmp/eval/
          retention-days: 30
          if-no-files-found: warn
