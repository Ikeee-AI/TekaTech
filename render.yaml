# Create a Blueprint from this repository. Credentials are entered in Render.
# GitHub Actions triggers deploys only after backend, frontend and SQL checks pass.
services:
  - type: web
    name: tekatech-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install uv==0.12.3 && uv sync --frozen --no-dev --python 3.12
    startCommand: .venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
  - type: web
    name: tekatech-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
