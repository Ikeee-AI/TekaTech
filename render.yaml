# Render Blueprint for the frontend only. Credentials are entered in Render.
# GitHub Actions triggers deploys only after backend, frontend and SQL checks pass.
# The API runs on Railway since 12 Nov 2026 (settings in .railway/railway.ts); its
# Render service was retired on 13 Nov 2026 (docs/devops/railway-migration-plan.md).
services:
  - type: web
    name: tekatech-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers on every response (Render blueprint: one name/value per entry).
    # The CSP is Report-Only first: violations only appear in the browser console.
    # Switch to enforced as described in docs/deploy-runbook.md ("Security headers").
    # connect-src must list the API origin baked in as VITE_API_BASE_URL and the
    # Supabase project (VITE_SUPABASE_URL; wss for its realtime socket).
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://tekatech-api-production-549b48c9.up.railway.app https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
