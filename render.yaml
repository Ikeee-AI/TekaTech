# Render Blueprint for the frontend only. Credentials are entered in Render.
# GitHub Actions triggers deploys only after backend, frontend and SQL checks pass.
# The API runs on Railway since 12 Nov 2026 (settings in .railway/railway.ts); its
# Render service was retired on 13 Nov 2026 (docs/devops/railway-migration-plan.md).
services:
  - type: web
    name: tekatech-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
