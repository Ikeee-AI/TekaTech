[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ikeee-AI" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "openai>=2.53.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "supabase>=2.33.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
